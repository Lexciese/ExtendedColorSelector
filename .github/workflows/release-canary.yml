name: Publish Canary Release

on:
  workflow_run:
    workflows:
      - Build Extended Color Selector (Qt5)
      - Build Extended Color Selector (Qt6)
    types:
      - completed
    branches:
      - main-cpp

permissions:
  actions: read
  contents: write

concurrency:
  group: extended-color-selector-canary-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish canary assets
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-22.04

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Download build artifacts from both Qt workflows
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          total=0

          for wf in build-qt5.yml build-qt6.yml; do
            runs_json="$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$COMMIT_SHA&status=completed&per_page=20")"
            run_id="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty' <<< "$runs_json")"

            if [ -z "$run_id" ]; then
              echo "No successful $wf run for $COMMIT_SHA yet; skipping publish (the other workflow's completion will publish)."
              exit 0
            fi

            artifacts_json="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100")"
            artifact_count="$(jq '[.artifacts[] | select(.expired == false and (.name | startswith("ExtendedColorSelector-")) and (.name | contains("diagnostics") | not))] | length' <<< "$artifacts_json")"

            if [ "$artifact_count" -ne 3 ]; then
              echo "::error::$wf produced $artifact_count build artifacts, expected 3"
              jq -r '.artifacts[] | "- \(.name) (expired=\(.expired))"' <<< "$artifacts_json"
              exit 1
            fi

            for suffix in linux windows macos; do
              count="$(jq --arg suffix "$suffix" '[.artifacts[] | select(.expired == false and (.name | startswith("ExtendedColorSelector-")) and (.name | contains("-" + $suffix + "-")) and (.name | contains("diagnostics") | not))] | length' <<< "$artifacts_json")"
              if [ "$count" -ne 1 ]; then
                echo "::error::Expected one $suffix artifact from $wf, found $count"
                exit 1
              fi
            done

            while IFS=$'\t' read -r artifact_id artifact_name; do
              echo "Downloading $artifact_name from $wf"
              gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > "dist/$artifact_name.zip"
            done < <(
              jq -r '.artifacts[] | select(.expired == false and (.name | startswith("ExtendedColorSelector-")) and (.name | contains("diagnostics") | not)) | [.id, .name] | @tsv' <<< "$artifacts_json"
            )

            total=$((total + artifact_count))
          done

          test "$total" -eq 6
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 6
          ls -lh dist

      - name: Move canary tag and replace release assets
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/$REPO/git/ref/tags/canary" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/canary" \
              -f sha="$COMMIT_SHA" \
              -F force=true >/dev/null
            echo "Moved canary tag to $COMMIT_SHA"
          else
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref='refs/tags/canary' \
              -f sha="$COMMIT_SHA" >/dev/null
            echo "Created canary tag at $COMMIT_SHA"
          fi

          release_body="Automated canary build for commit [$COMMIT_SHA](https://github.com/$REPO/commit/$COMMIT_SHA)."
          if release_json="$(gh api "repos/$REPO/releases/tags/canary" 2>/dev/null)"; then
            release_id="$(jq -r '.id' <<< "$release_json")"
            gh api -X PATCH "repos/$REPO/releases/$release_id" \
              -f tag_name='canary' \
              -f name='canary' \
              -f body="$release_body" \
              -F prerelease=true \
              -F draft=false >/dev/null
          else
            release_json="$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name='canary' \
              -f name='canary' \
              -f body="$release_body" \
              -F prerelease=true \
              -F draft=false)"
            release_id="$(jq -r '.id' <<< "$release_json")"
          fi

          gh api "repos/$REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[].id' | while read -r asset_id; do
              [ -n "$asset_id" ] && gh api -X DELETE "repos/$REPO/releases/assets/$asset_id"
            done

          gh release upload canary dist/*.zip --clobber --repo "$REPO"
